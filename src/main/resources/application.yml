logging:
  level:
    root: INFO

spring:
  application:
    name: ticket-rush

  datasource:
    url: jdbc:postgresql://localhost:5432/ticket_rush?options=-c%20TimeZone=UTC
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081