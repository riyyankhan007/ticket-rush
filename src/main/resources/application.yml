logging:
  level:
    root: INFO

spring:
  application:
    name: ticket-rush

  datasource:
    url: jdbc:postgresql://localhost:5432/ticket_rush
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

jwt:
  secret: YzQ5MjMwNTA3ODQwMzI4Njk5OTQzOTI5NjQzOTg2NTQxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMw==
  expiration: 86400000
  refresh-expiration: 604800000